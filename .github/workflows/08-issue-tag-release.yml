name: Release automatico por tag

on:  
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crear-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout con todo el historial y tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generar notas del release (logs y cambios)
        id: notas
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)

          if [ -n "$PREV_TAG" ]; then
            RANGO="${PREV_TAG}..${TAG}"
            DESDE="desde \`${PREV_TAG}\`"
          else
            RANGO="${TAG}"
            DESDE="(primer release)"
          fi

          {
            echo "## Release ${TAG}"
            echo ""
            echo "- **Fecha:** $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "- **Creado por:** @${GITHUB_ACTOR}"
            echo "- **Commit:** \`$(git rev-parse --short "${TAG}")\`"
            echo "- **Cambios** ${DESDE}"
            echo ""
            echo "### Commits"
            echo ""
            git log "${RANGO}" --no-merges --pretty=format:"- %s (\`%h\`) - %an"
            echo ""
            echo ""
            echo "### Archivos modificados"
            echo ""
            echo '```'
            if [ -n "$PREV_TAG" ]; then
              git diff --stat "${PREV_TAG}" "${TAG}"
            else
              git show --stat --pretty=format:"" "${TAG}"
            fi
            echo '```'
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "**Comparacion completa:** ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${TAG}"
              echo ""
            fi
          } > release-notes.md

          cat release-notes.md
          echo "prev_tag=${PREV_TAG}" >> "$GITHUB_OUTPUT"

      - name: Crear el release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREV_TAG: ${{ steps.notas.outputs.prev_tag }}
        run: |
          TAG="${GITHUB_REF_NAME}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "El release ${TAG} ya existe, actualizando notas..."
            gh release edit "$TAG" --notes-file release-notes.md
            exit 0
          fi

          # --generate-notes agrega las notas automaticas de GitHub (PRs y contribuidores) despues de las nuestras
          ARGS=(--title "Release ${TAG}" --notes-file release-notes.md --verify-tag --generate-notes)
          if [ -n "$PREV_TAG" ]; then
            ARGS+=(--notes-start-tag "$PREV_TAG")
          fi

          # Tags tipo v1.0.0-beta se marcan como pre-release
          if [[ "$TAG" == *-* ]]; then
            ARGS+=(--prerelease)
          fi

          gh release create "$TAG" "${ARGS[@]}"

      - name: Resumen
        run: |
          echo "## Release ${GITHUB_REF_NAME} creado" >> "$GITHUB_STEP_SUMMARY"
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"
